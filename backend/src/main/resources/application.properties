spring.application.name=enterprise-risk-api
server.port=8080

# Auth0: the issuer must start with https:// and end with a trailing slash.
# Override with the env var SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-kf4ghetx40fgzuc6.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://enterprise-risk-api

# Exact browser origins allowed to call the API (no wildcards). Override with APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=http://localhost:5173,https://sebas-risk-lab.duckdns.org

management.endpoints.web.exposure.include=health
