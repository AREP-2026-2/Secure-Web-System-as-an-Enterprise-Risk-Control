# /etc/apache2/sites-available/enterprise-risk.conf
# Certbot (--apache) creates the HTTPS (443) copy and the HTTP->HTTPS redirect from this file.
<VirtualHost *:80>
    ServerName sebas-risk-lab.duckdns.org
    DocumentRoot /var/www/enterprise-risk-frontend

    <Directory /var/www/enterprise-risk-frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    RequestHeader set X-Forwarded-Proto "http"

    # Vhost-level rewrite engine so the HTTP->HTTPS redirect Certbot appends here takes effect.
    RewriteEngine On
</VirtualHost>
